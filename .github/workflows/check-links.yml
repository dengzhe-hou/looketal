name: Check links

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every catalogued page
        id: check
        run: python -I -B tools/check_links.py | tee link_report.txt
        continue-on-error: true
      - name: Open an issue when pages are broken
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Broken links $(date -u +%F)" --body-file link_report.txt
